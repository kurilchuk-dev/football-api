name: Keep alive

# The free Render plan puts the API to sleep after ~15 minutes without requests,
# and the first request afterwards takes about a minute. Ping /health/ (it does
# not touch the database, so Neon is still free to sleep) every 10 minutes.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    name: Ping the API
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: GET /health/
        run: curl --fail --silent --show-error --retry 3 --retry-delay 20 --max-time 90 https://football-api-eu.onrender.com/health/
