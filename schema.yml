openapi: 3.0.3
info:
  title: Football API
  version: 1.0.0
  description: 'API for the football team website: teams, matches, standings and players.'
paths:
  /api/matches/:
    get:
      operationId: matches_list
      parameters:
        - in: query
          name: team
          schema:
            type: integer
          description: Show only matches of the team with this id
      tags:
        - matches
      security:
        - cookieAuth: []
        - basicAuth: []
        - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Match'
          description: ''
  /api/matches/{id}/:
    get:
      operationId: matches_retrieve
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          description: A unique integer value identifying this матч.
          required: true
      tags:
        - matches
      security:
        - cookieAuth: []
        - basicAuth: []
        - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Match'
          description: ''
  /api/matches/results/:
    get:
      operationId: matches_results_list
      parameters:
        - in: query
          name: team
          schema:
            type: integer
          description: Show only matches of the team with this id
      tags:
        - matches
      security:
        - cookieAuth: []
        - basicAuth: []
        - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Match'
          description: ''
  /api/matches/upcoming/:
    get:
      operationId: matches_upcoming_list
      parameters:
        - in: query
          name: team
          schema:
            type: integer
          description: Show only matches of the team with this id
      tags:
        - matches
      security:
        - cookieAuth: []
        - basicAuth: []
        - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Match'
          description: ''
  /api/players/:
    get:
      operationId: players_list
      parameters:
        - in: query
          name: our_team
          schema:
            type: boolean
          description: 'true: show only players of our team (the one marked as ours),
            no id needed'
        - in: query
          name: team
          schema:
            type: integer
          description: Show only players of the team with this id
      tags:
        - players
      security:
        - cookieAuth: []
        - basicAuth: []
        - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Player'
          description: ''
  /api/players/{id}/:
    get:
      operationId: players_retrieve
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          description: A unique integer value identifying this гравець.
          required: true
      tags:
        - players
      security:
        - cookieAuth: []
        - basicAuth: []
        - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Player'
          description: ''
  /api/staff/:
    get:
      operationId: staff_list
      tags:
        - staff
      security:
        - cookieAuth: []
        - basicAuth: []
        - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StaffMember'
          description: ''
  /api/staff/{id}/:
    get:
      operationId: staff_retrieve
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          description: A unique integer value identifying this тренерський штаб.
          required: true
      tags:
        - staff
      security:
        - cookieAuth: []
        - basicAuth: []
        - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffMember'
          description: ''
  /api/standings/:
    get:
      operationId: standings_list
      tags:
        - standings
      security:
        - cookieAuth: []
        - basicAuth: []
        - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StandingRow'
          description: ''
  /api/teams/:
    get:
      operationId: teams_list
      tags:
        - teams
      security:
        - cookieAuth: []
        - basicAuth: []
        - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Team'
          description: ''
  /api/teams/{id}/:
    get:
      operationId: teams_retrieve
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          description: A unique integer value identifying this команда.
          required: true
      tags:
        - teams
      security:
        - cookieAuth: []
        - basicAuth: []
        - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
          description: ''
components:
  schemas:
    FormEnum:
      enum:
        - W
        - D
        - L
      type: string
      description: |-
        * `W` - W
        * `D` - D
        * `L` - L
    Match:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        home_team:
          allOf:
            - $ref: '#/components/schemas/Team'
          readOnly: true
        away_team:
          allOf:
            - $ref: '#/components/schemas/Team'
          readOnly: true
        home_score:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
          title: Голи господарів
        away_score:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
          title: Голи гостей
        date:
          type: string
          format: date
          readOnly: true
          nullable: true
        time:
          type: string
          format: time
          readOnly: true
          nullable: true
        played_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        round:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
          title: Тур
          description: Номер туру, наприклад 5.
        venue:
          type: string
          title: Місце
          description: Де грають, наприклад назва зали та місто. Показується на сторінці
            матчу.
          maxLength: 150
        report:
          type: string
          title: Звіт про матч
          description: Кілька абзаців про гру. Вони з'являться на сторінці матчу й
            у пошуку.
      required:
        - away_team
        - date
        - home_team
        - id
        - played_at
        - time
    Player:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        first_name:
          type: string
          title: Ім'я
          maxLength: 50
        last_name:
          type: string
          title: Прізвище
          maxLength: 50
        number:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
          title: Номер
          description: Номер на футболці; залиште порожнім, якщо ще не призначено.
        photo:
          type: string
          format: uri
          nullable: true
          title: Фото
          description: Портрет для сторінки команди.
      required:
        - first_name
        - id
        - last_name
    RoleEnum:
      enum:
        - head_coach
        - assistant
        - manager
      type: string
      description: |-
        * `head_coach` - Головний тренер
        * `assistant` - Помічник тренера
        * `manager` - Менеджер команди
    StaffMember:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        first_name:
          type: string
          title: Ім'я
          maxLength: 50
        last_name:
          type: string
          title: Прізвище
          maxLength: 50
        role:
          allOf:
            - $ref: '#/components/schemas/RoleEnum'
          title: Посада
        role_display:
          type: string
          readOnly: true
      required:
        - first_name
        - id
        - last_name
        - role
        - role_display
    StandingRow:
      type: object
      properties:
        position:
          type: integer
        team:
          $ref: '#/components/schemas/StandingTeam'
        played:
          type: integer
        won:
          type: integer
        drawn:
          type: integer
        lost:
          type: integer
        goals_for:
          type: integer
        goals_against:
          type: integer
        goal_difference:
          type: integer
        points:
          type: integer
        form:
          type: array
          items:
            $ref: '#/components/schemas/FormEnum'
          description: Results of the last 5 matches, oldest first (W/D/L).
      required:
        - drawn
        - form
        - goal_difference
        - goals_against
        - goals_for
        - lost
        - played
        - points
        - position
        - team
        - won
    StandingTeam:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        is_our_team:
          type: boolean
        logo:
          type: string
          format: uri
          nullable: true
          readOnly: true
        photo:
          type: string
          format: uri
          nullable: true
          readOnly: true
      required:
        - id
        - is_our_team
        - logo
        - name
        - photo
    Team:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          title: Назва
          maxLength: 100
        city:
          type: string
          title: Місто
          maxLength: 100
        is_our_team:
          type: boolean
          title: Наша команда
        logo:
          type: string
          format: uri
          nullable: true
          title: Логотип
        photo:
          type: string
          format: uri
          nullable: true
          title: Фото команди
          description: 'Загальне фото команди: відкривається на сайті, коли натиснути
            на команду.'
      required:
        - id
        - name
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
